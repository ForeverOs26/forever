name: quality-gate

# The single canonical repository gate. It runs the same command a developer
# runs locally: `npm run verify:ci`. It uses no secrets, touches no external
# service, and deploys nothing. Contract: docs/FOREVER_DEVELOPMENT_WORKFLOW.md

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Stale PR runs are cancelled. A run on `main` is release evidence, so it is
  # always allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    # `npm ci` plus the full gate; the local Windows baseline is ~10 minutes.
    timeout-minutes: 45
    steps:
      - name: Check out the branch with full history
        uses: actions/checkout@v4
        with:
          # `lint:changed` needs the merge base with the target branch.
          fetch-depth: 0

      - name: Lint the workflows with pinned actionlint
        # Pinned twice: an exact release version, and the SHA-256 that release
        # publishes for this archive. The checksum is verified BEFORE the
        # archive is extracted or executed, so a substituted or truncated
        # download fails the job instead of linting with it. No `latest`, no
        # remote installer script piped into a shell, no unverified binary.
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict -
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -version
          # No file arguments: actionlint discovers every workflow file under
          # `.github/workflows`, so a new one cannot arrive unlinted.
          "${RUNNER_TEMP}/actionlint" -color

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the Node major the local baseline was measured on.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve the changed-file lint base
        # Context values reach the shell as environment variables, never as
        # interpolated script text.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            echo "FOREVER_LINT_BASE=origin/$BASE_REF" >> "$GITHUB_ENV"
          else
            echo "FOREVER_LINT_BASE=HEAD~1" >> "$GITHUB_ENV"
          fi

      - name: Verify
        run: npm run verify:ci
